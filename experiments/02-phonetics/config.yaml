voice: qwen3-tts-1.7b-voicedesign/warm_male  # cloned by engines that can clone; the others use their built-in voice
texts: phonetics.jsonl
seeds: [0, 1]
# engine name (see labtts/engines/__init__.py) -> variants: name -> setting overrides on top of the engine defaults
engines:
  qwen3-tts-0.6b:
    default: {}  # the model's generation_config.json: temperature 0.9, top-k 50
    conservative: {temperature: 0.6, top_k: 20}
  audio8-air:
    cloned: {}  # model card defaults: temperature 0.8, top-p 0.95, top-k 50
    built_in_voice: {reference: none}
  ming-tts-0.5b:
    default: {}  # MingTTS.synthesize() defaults: cfg 2.0, sigma 0.25, temperature 0, its own text splitting
