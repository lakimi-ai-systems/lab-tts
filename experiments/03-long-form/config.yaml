voice: qwen3-tts-1.7b-voicedesign/warm_male  # cloned by engines that can clone; the others use their built-in voice
text: long_form_ai.txt  # ~375 words, about two minutes of speech
seeds: [0, 1]
modes:
  one_shot: the whole text in a single generation
  per_sentence: one generation per sentence, joined with a short silence (how a voice gateway usually feeds a TTS)
sentence_gap_seconds: 0.25
window_seconds: 20
# engine name -> variants: name -> setting overrides on top of the engine defaults
engines:
  qwen3-tts-0.6b:
    default: {max_new_tokens: 3000}  # 240 s of audio: room for the whole text in a single generation
  audio8-air:
    cloned: {}  # its 2048-position context caps a single generation at about a minute
  ming-tts-0.5b:
    default: {}  # its 512-position context caps a generation at ~20 s, so one_shot uses the model's own splitting
